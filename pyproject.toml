[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vram-coordinator"
version = "0.1.0"
description = "GPU memory reservations for concurrent local-LLM workloads on AMD hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "oscargzss" }]
keywords = ["amdgpu", "vram", "llama-cpp", "gguf", "gpu-memory", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/oscargzss/vram-coordinator"
Repository = "https://github.com/oscargzss/vram-coordinator"
Issues = "https://github.com/oscargzss/vram-coordinator/issues"
Changelog = "https://github.com/oscargzss/vram-coordinator/commits/main"

[tool.setuptools]
py-modules = ["vram_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "PYI", "BLE", "PERF"]
ignore = ["E501"]
