name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[test]"
      - name: Test
        run: .venv/bin/pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.16.9
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test against the installed wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/*.whl pytest pytest-timeout
          # Run from outside the checkout so the tests import the wheel
          # from site-packages rather than the source tree.
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/pytest" -q "$GITHUB_WORKSPACE/tests"
